[package]
name = "riscv-toolbox"
version = "0.1.0"
description = "RISC-V 工具箱"
edition = "2021"

[lib]
name = "riscv_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
